[project]
name = "peer-options"
version = "0.1.0"
description = "Research: do announcer earnings-call signals predict peers' option pricing?"
requires-python = ">=3.11"
dependencies = ["pandas>=2.0", "pyyaml>=6.0", "pyarrow>=14.0"]

[project.optional-dependencies]
# Heavy, only needed to run the real FinBERT scorer. Not installed by default.
finbert = ["torch>=2.0", "transformers>=4.30"]
# Needs Python >= 3.12 and a ThetaData subscription. The library imports python-dotenv without declaring it.
theta = ["thetadata>=1.0", "python-dotenv"]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
