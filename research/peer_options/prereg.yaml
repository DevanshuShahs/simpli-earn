# Pre-registration, LOCKED (see prereg.lock). Any edit changes the SHA-256 and blocks study code (prereg.verify).
# To amend: delete prereg.lock deliberately, edit, re-lock, and record why in the commit message.
version: 1
status: locked
mode: pilot
purpose: >
  Pilot to decide whether a larger study is worth the time. It is not a confirmatory test.
  Below min_events, report descriptive effect sizes and event-level scatter only, with no p-values or
  significance claims. Whether to invest further is a human decision made after the development-sample
  descriptives; the forward holdout is the single confirmatory look.
hypotheses:
  H1: "Announcer A's call signals predict peer B's abnormal implied-vol change beyond A's own IV change and the industry-date average."
  H2: "The H1 effect builds over days 0-5 after A's call rather than being absorbed at the first close (tradable core)."
  H3: "A's signals predict B's realized earnings move relative to its implied move."
  H4: "A's directional tone predicts the change in B's 25-delta put skew."
  H5: {text: "Audio stress features add out-of-sample power over text.", status: deferred}
signals:
  - {name: tone_delta, scorer: loughran_mcdonald, scope: executive_speech}   # dictionary-only; FinBERT deliberately excluded
  - {name: hedging_density, terms: loughran_mcdonald_uncertainty, scope: executive_speech}
  - {name: tone_gap_G, definition: "tone_prepared - tone_qa", scope: executive_speech}
  - {name: analyst_tone, scope: analyst_questions, role: robustness}
baseline:
  window_calls: [4, 8]     # previous 4-8 calls
  min_calls: 4             # below this the signal is NaN, never imputed
  standardize: zscore_vs_own_history
peer_signal:
  link_weights: industry_membership   # disclosed-link and transcript-mention weights are hooks only
  formula: "S_BA = link_weight * announcer_signal"
event_study:
  outcome: abnormal_iv_change   # peer IV change net of sector-ETF and market-vol components
  horizon_days: [0, 1, 2, 3, 4, 5]
  controls: [announcer_iv_change, industry_date_avg_iv_change, announcer_earnings_surprise,
             announcer_stock_return, peer_iv_rank, days_to_peer_report]
  fixed_effects: [date]
  cluster: [date, industry]
timing:
  call_duration_minutes: 60        # assumed; true end times unavailable
  signal_available_minutes_after_start: 90   # signal_available_at = call_start + 90 min (user decision)
  entry: first_open_after_signal__enter_at_close
  exit: close_before_peer_report
  usable_dates: confirmed_only     # estimated earnings dates are never used for decisions
event_filter:
  min_window_trading_days: 1   # excludes the 4 TXN->STM events with window 0 or -1 (decided by user)
  exclude_event_ids: []
thresholds:
  significance: 0.05
  multiple_testing: holm           # across H1-H4
  min_events: 30                   # baseline-eligible events required before any inferential test (not reachable by the pilot)
holdout:
  # Forward holdout: the 3Q26 reporting season. An event is in the holdout if its announcer call date is in
  # [start, end] inclusive (ET). Not looked at until the pre-registered specification is final.
  applies_to: announcer_call_date
  start: 2026-10-01
  end: 2026-12-31
development_sample: events with announcer call date before the holdout start (3Q25 through 2Q26 so far)
